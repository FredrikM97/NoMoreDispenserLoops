version: 2
updates:
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: nuget
    directory: /src/NoMoreDispenserLoops
    schedule:
      interval: monthly

  - package-ecosystem: nuget
    directory: /tests/NoMoreDispenserLoops.Tests
    schedule:
      interval: monthly
