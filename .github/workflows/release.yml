name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      action:
        description: Action
        type: choice
        required: true
        default: update_draft
        options: [update_draft, publish]
      bump:
        description: Version bump for the shared release
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.action == 'update_draft')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Update rolling draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: bash scripts/release/draft.sh

  prepare:
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.action == 'publish' ||
      github.event_name == 'release' && github.event.action == 'published' &&
      (startsWith(github.event.release.tag_name, 'v') || contains(github.event.release.tag_name, '-v'))
    runs-on: ubuntu-latest
    env:
      RELEASE_SCRIPTS: ${{ github.event_name == 'release' && '.release-workflow/scripts/release' || 'scripts/release' }}
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      last_tag: ${{ steps.prepare.outputs.last_tag }}
      mods: ${{ steps.prepare.outputs.mods }}
      ref: ${{ steps.prepare.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Older release tags may not contain the scripts used by this workflow.
      - name: Check out release scripts
        if: github.event_name == 'release'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-workflow
          persist-credentials: false
      - name: Prepare shared release
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BUMP: ${{ inputs.bump }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: bash "$RELEASE_SCRIPTS/prepare.sh"

  publish:
    needs: prepare
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.action == 'publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Test all mods
        env:
          MODS: ${{ needs.prepare.outputs.mods }}
        shell: bash
        run: bash scripts/release/test.sh
      - name: Prepare all release packages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MODS: ${{ needs.prepare.outputs.mods }}
        shell: bash
        run: bash scripts/release/package.sh
      - name: Publish combined release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          LAST_TAG: ${{ needs.prepare.outputs.last_tag }}
          MODS: ${{ needs.prepare.outputs.mods }}
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: bash scripts/release/publish.sh

  workshop:
    needs: [prepare, publish]
    if: >-
      always() && needs.prepare.result == 'success' && (
        needs.publish.result == 'success' ||
        (github.event_name == 'release' && github.event.action == 'published' &&
          (startsWith(github.event.release.tag_name, 'v') || contains(github.event.release.tag_name, '-v')))
      )
    runs-on: ubuntu-latest
    environment: steam
    env:
      RELEASE_SCRIPTS: ${{ github.event_name == 'release' && '.release-workflow/scripts/release' || 'scripts/release' }}
    permissions:
      contents: read
    strategy:
      matrix:
        mod: ${{ fromJSON(needs.prepare.outputs.mods || '[{"name":"skip","workshop_id":"0"}]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - name: Check out release scripts
        if: github.event_name == 'release'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-workflow
          persist-credentials: false
      - name: Check Workshop configuration
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        shell: bash
        run: bash "$RELEASE_SCRIPTS/check-workshop.sh"
      - name: Download release package
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          MOD: ${{ matrix.mod.name }}
        shell: bash
        run: bash "$RELEASE_SCRIPTS/download-workshop.sh"
      - name: Publish to Steam Workshop
        uses: m00nl1ght-dev/steam-workshop-deploy@7abf9c7628c3bc79229c9bca93f7a7296fa82428 # v4
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          path: workshop-upload
          appId: 457140
          publishedFileId: ${{ matrix.mod.workshop_id }}
          changeNote: Release ${{ needs.prepare.outputs.tag }}
