name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      action:
        description: Action
        type: choice
        required: true
        default: update_draft
        options: [update_draft, publish]
      bump:
        description: Version bump (for publish)
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.action == 'update_draft')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Update rolling draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          last_tag=$(git tag --list 'v*' | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' | sort -V | tail -n 1)
          range=HEAD
          if [[ -n "$last_tag" ]]; then
            range="$last_tag..HEAD"
          fi
          {
            echo '## Changes'
            git log "$range" --no-merges --format='- %s (%h)'
            echo
            if [[ -n "$last_tag" ]]; then
              echo "**Full changelog:** https://github.com/$REPOSITORY/compare/$last_tag...main"
            else
              echo "**Full changelog:** https://github.com/$REPOSITORY/commits/main"
            fi
          } > release-notes.md

          existing=$(gh release list --limit 1000 --json tagName,isDraft \
            --jq '[.[] | select(.tagName == "unreleased") | if .isDraft then "draft" else "published" end] | first // "missing"')
          if [[ "$existing" == draft ]]; then
            gh release edit unreleased --title Unreleased --notes-file release-notes.md --target main --draft
          elif [[ "$existing" == published ]]; then
            echo "::error::The unreleased release already exists and is not a draft."
            exit 1
          else
            gh release create unreleased --title Unreleased --notes-file release-notes.md --target main --draft
          fi

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.action == 'publish'
    runs-on: ubuntu-latest
    outputs:
      tag: v${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Check release prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          draft=$(gh release list --limit 1000 --json tagName,isDraft \
            --jq '[.[] | select(.tagName == "unreleased") | if .isDraft then "draft" else "published" end] | first // "missing"')
          if [[ "$draft" != draft ]]; then
            echo "::error::Create the unreleased draft before publishing."
            exit 1
          fi
      - name: Determine version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          set -euo pipefail
          last_tag=$(git tag --list 'v*' | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' | sort -V | tail -n 1)
          base=${last_tag#v}
          base=${base:-0.0.0}
          IFS=. read -r major minor patch <<< "$base"
          case "$BUMP" in
            major) major=$((10#$major + 1)); minor=0; patch=0 ;;
            minor) minor=$((10#$minor + 1)); patch=0 ;;
            patch) patch=$((10#$patch + 1)) ;;
            *) echo "::error::Invalid version bump."; exit 1 ;;
          esac
          version="$major.$minor.$patch"
          if git rev-parse --verify --quiet "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "last_tag=$last_tag" >> "$GITHUB_OUTPUT"
      - name: Test
        run: dotnet test tests/NoMoreDispenserLoops.Tests/NoMoreDispenserLoops.Tests.csproj -c Release
      - name: Prepare release package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package.sh "$VERSION" "$RUNNER_TEMP/package"
          oni_build=$(<"$RUNNER_TEMP/package/NoMoreDispenserLoops/oni-build.txt")
          if [[ ! "$oni_build" =~ ^[0-9]+$ ]]; then
            echo "::error::Package contains an invalid ONI build."
            exit 1
          fi
      - name: Publish draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          LAST_TAG: ${{ steps.version.outputs.last_tag }}
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          range="$COMMIT"
          if [[ -n "$LAST_TAG" ]]; then
            range="$LAST_TAG..$COMMIT"
          fi
          oni_build=$(<"$RUNNER_TEMP/package/NoMoreDispenserLoops/oni-build.txt")
          {
            echo "**Built against ONI build:** $oni_build"
            echo
            echo '## Changes'
            git log "$range" --no-merges --format='- %s (%h)'
            echo
            if [[ -n "$LAST_TAG" ]]; then
              echo "**Full changelog:** https://github.com/$REPOSITORY/compare/$LAST_TAG...v$VERSION"
            else
              echo "**Full changelog:** https://github.com/$REPOSITORY/commits/v$VERSION"
            fi
          } > release-notes.md
          gh release upload unreleased "$RUNNER_TEMP/package/NoMoreDispenserLoops-$VERSION.zip" --clobber
          legacy_asset=$(gh release view unreleased --json assets --jq '[.assets[].name | select(. == "NoMoreDispenserLoops.zip")] | first // ""')
          if [[ -n "$legacy_asset" ]]; then
            gh release delete-asset unreleased "$legacy_asset" --yes
          fi
          gh release edit unreleased --tag "v$VERSION" --title "v$VERSION" \
            --notes-file release-notes.md --target "$COMMIT" --draft=false --latest

  workshop:
    needs: publish
    if: always() && (needs.publish.result == 'success' || github.event_name == 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check Workshop configuration
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          STEAM_WORKSHOP_ITEM_ID: ${{ vars.STEAM_WORKSHOP_ITEM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$STEAM_USERNAME" || -z "$STEAM_CONFIG_VDF" ]]; then
            echo "::error::Configure the STEAM_USERNAME and STEAM_CONFIG_VDF secrets."
            exit 1
          fi
          if [[ ! "$STEAM_WORKSHOP_ITEM_ID" =~ ^0*[1-9][0-9]*$ ]]; then
            echo "::error::Configure STEAM_WORKSHOP_ITEM_ID with an existing item ID."
            exit 1
          fi
      - name: Download release package
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.publish.outputs.tag || github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Workshop releases require a vMAJOR.MINOR.PATCH tag."
            exit 1
          fi
          version=${BASH_REMATCH[1]}
          mkdir -p "$GITHUB_WORKSPACE/workshop-upload"
          gh release download "$TAG" --repo "$REPOSITORY" \
            --pattern "NoMoreDispenserLoops-$version.zip" --dir "$RUNNER_TEMP"
          archive="$RUNNER_TEMP/NoMoreDispenserLoops-$version.zip"
          for file in NoMoreDispenserLoops.dll mod.yaml mod_info.yaml README.md; do
            if ! unzip -p "$archive" "NoMoreDispenserLoops/$file" > "$GITHUB_WORKSPACE/workshop-upload/$file"; then
              echo "::error::Release package is missing $file."
              exit 1
            fi
            if [[ ! -s "$GITHUB_WORKSPACE/workshop-upload/$file" ]]; then
              echo "::error::Release package contains an empty $file."
              exit 1
            fi
          done
          if ! grep -Fxq "version: $version" "$GITHUB_WORKSPACE/workshop-upload/mod_info.yaml"; then
            echo "::error::Release package version does not match $TAG."
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Publish to Steam Workshop
        uses: m00nl1ght-dev/steam-workshop-deploy@v4
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          path: workshop-upload
          appId: 457140
          publishedFileId: ${{ vars.STEAM_WORKSHOP_ITEM_ID }}
          changeNote: Release ${{ needs.publish.outputs.tag || github.event.release.tag_name }}
